name: Deploy backend

on:
  push:
    branches: [dev, rc]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        env:
          DEPLOY_HOST: 153.51.173.24
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
          POSTGRES_ENV_FILE: ${{ secrets.POSTGRES_ENV_FILE }}
          DELETE_DBDATA: ${{ vars.DELETE_DBDATA }}
        run: |
          set -euo pipefail

          : "${DEPLOY_USER:?Add DEPLOY_USER to GitHub secrets}"
          : "${DEPLOY_SSH_KEY:?Add DEPLOY_SSH_KEY to GitHub secrets}"
          : "${SSH_KNOWN_HOSTS:?Add SSH_KNOWN_HOSTS to GitHub secrets}"
          : "${BACKEND_ENV_FILE:?Add BACKEND_ENV_FILE to GitHub secrets}"
          : "${POSTGRES_ENV_FILE:?Add POSTGRES_ENV_FILE to GitHub secrets}"

          DELETE_DBDATA="${DELETE_DBDATA:-false}"

          case "$DELETE_DBDATA" in
            true|false) ;;
            *)
              echo "DELETE_DBDATA must be exactly 'true' or 'false'"
              exit 1
              ;;
          esac

          case "$GITHUB_REF_NAME" in
            dev)
              COMPOSE_FILE="docker-compose.dev.yml"
              DB_DATA_DIR="dbdata_dev"
              ;;
            rc)
              COMPOSE_FILE="docker-compose.yml"
              DB_DATA_DIR="dbdata"
              ;;
            *)
              echo "Unsupported branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          REMOTE_DIR="backend-app"
          SSH_DIR="$RUNNER_TEMP/deploy-ssh"

          install -d -m 700 "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"

          cat > "$SSH_DIR/config" <<EOF
          Host deploy-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ${SSH_DIR}/key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ${SSH_DIR}/known_hosts
            BatchMode yes
          EOF
          chmod 600 "$SSH_DIR/config"

          mkdir -p "$SSH_DIR/env"
          printf '%s' "$BACKEND_ENV_FILE" > "$SSH_DIR/env/backend.env"
          printf '%s' "$POSTGRES_ENV_FILE" > "$SSH_DIR/env/postgres.env"
          chmod 600 "$SSH_DIR/env/"*

          ssh -F "$SSH_DIR/config" deploy-server \
            'mkdir -p "$HOME/backend-app/backend"'

          if [ "$DELETE_DBDATA" = "true" ]; then
            echo "DELETE_DBDATA=true: deleting $DB_DATA_DIR for branch $GITHUB_REF_NAME"

            ssh -F "$SSH_DIR/config" deploy-server \
              bash -s -- "$REMOTE_DIR" "$COMPOSE_FILE" "$DB_DATA_DIR" <<'REMOTE'
          set -euo pipefail

          remote_dir="$HOME/$1"
          compose_file="$2"
          data_dir="$3"

          case "$compose_file:$data_dir" in
            docker-compose.dev.yml:dbdata_dev|docker-compose.yml:dbdata) ;;
            *)
              echo "Unexpected compose/data directory combination" >&2
              exit 1
              ;;
          esac

          if [ -d "$remote_dir/$data_dir" ]; then
            if [ ! -f "$remote_dir/$compose_file" ]; then
              echo "Cannot safely delete data: $remote_dir/$compose_file not found" >&2
              exit 1
            fi

            cd "$remote_dir"
            docker compose -f "$compose_file" stop db
            rm -rf -- "$remote_dir/$data_dir"
          fi
          REMOTE
          fi

          rsync -az --delete \
            --exclude='/.git/' \
            --exclude='/backend/.env' \
            --exclude='/postgres.env' \
            --exclude='/dbdata/' \
            --exclude='/dbdata_dev/' \
            --filter='P /dbdata/***' \
            --filter='P /dbdata_dev/***' \
            -e "ssh -F $SSH_DIR/config" \
            ./ "deploy-server:${REMOTE_DIR}/"

          ssh -F "$SSH_DIR/config" deploy-server \
            'umask 077; cat > "$HOME/backend-app/backend/.env"; chmod 600 "$HOME/backend-app/backend/.env"' \
            < "$SSH_DIR/env/backend.env"

          ssh -F "$SSH_DIR/config" deploy-server \
            'umask 077; cat > "$HOME/backend-app/postgres.env"; chmod 600 "$HOME/backend-app/postgres.env"' \
            < "$SSH_DIR/env/postgres.env"

          ssh -F "$SSH_DIR/config" deploy-server \
            bash -s -- "$REMOTE_DIR" "$COMPOSE_FILE" <<'REMOTE'
          set -euo pipefail

          cd "$HOME/$1"
          compose_file="$2"

          docker compose -f "$compose_file" build
          docker compose -f "$compose_file" up -d
          REMOTE